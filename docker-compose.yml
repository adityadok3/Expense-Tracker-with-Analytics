version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: expense_tracker_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: expensetracker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: expense_tracker_server
    restart: always
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/expensetracker?schema=public
      PORT: 5000
      NODE_ENV: production
      CLIENT_URL: http://localhost:5173
      JWT_SECRET: super_secret_jwt_access_key_change_in_production_2026
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_SECRET: super_secret_jwt_refresh_key_change_in_production_2026
      JWT_REFRESH_EXPIRES_IN: 7d
    depends_on:
      - postgres

volumes:
  postgres_data:
